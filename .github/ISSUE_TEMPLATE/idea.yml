name: Предложение
description: Чего не хватает или что стоило бы сделать иначе
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        **Сначала загляните в [план](../../blob/main/docs/ROADMAP.md).** Часть
        того, что выглядит очевидным улучшением, там намеренно отложена или
        намеренно исключена — и в обоих случаях написано почему. Спорить с
        записанной причиной куда полезнее, чем предлагать мимо неё.

  - type: textarea
    id: problem
    attributes:
      label: Что мешает
      description: >
        Не «добавьте кнопку», а что вы пытались сделать и обо что споткнулись.
        Задача почти всегда решается не так, как выглядит с первого взгляда,
        и без исходного затруднения выбрать между решениями нечем.
      placeholder: |
        Каждое утро открываю три программы подряд и включаю тихий режим.
        Делаю это руками, потому что…
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Как вы это видите
      description: Необязательно. Если решение уже есть в голове — опишите.

  - type: textarea
    id: instead
    attributes:
      label: Как обходитесь сейчас
      description: >
        Тоже необязательно, но полезнее, чем кажется: рабочий обход
        показывает, насколько это срочно на самом деле.

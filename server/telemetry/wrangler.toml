# The beta's telemetry collector (`4.0b-D05`). Deployed by hand — see README.md.
name = "rina-telemetry"
main = "worker.js"
compatibility_date = "2026-09-01"

# Request logs would hold the addresses reports came from; the collector
# promises not to keep them, so they are not switched on.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "rina_telemetry"
# Filled in after `wrangler d1 create rina_telemetry`.
database_id = ""

# The nightly clean-up of reports older than 180 days.
[triggers]
crons = ["17 3 * * *"]
